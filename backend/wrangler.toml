name = "ghi-core"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# JWT_SECRET and DATABASE_URL are Worker secrets, not vars — this file is
# committed. Set them with:
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put DATABASE_URL
# Locally they come from backend/.dev.vars (gitignored).

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "2c3d595f50c14b81a7ac44cb52a5d40a"

[triggers]
# Twice daily, 06:00 and 18:00 UTC — 09:00 and 21:00 Riyadh. Set at the CEO's
# request. The retrospective windows are all far wider than 12 hours, so
# nothing ages out of view between passes.
crons = ["0 6,18 * * *"]

[observability]
enabled = true
