[project]
name = "seha-radar"
version = "1.0.0"
description = "SehaRadar - AI-powered Health Surveillance System"
requires-python = ">=3.11"
dependencies = [
    "openai-agents",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "pdfplumber",
    "python-dotenv",
    "aiosqlite",
    "openai",
    "beautifulsoup4",
    "lxml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["health_agents", "workflows", "tools", "parsers"]

[dependency-groups]
dev = []

[tool.pytest.ini_options]
testpaths = ["tests"]
